[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hecos-tray"
version = "1.5.4"
description = "Hecos Standalone Tray Launcher & Dashboard"

# These are the ONLY packages needed to run the Tray standalone.
# The Hecos Core has its own, larger dependency list.
dependencies = [
    "pystray>=0.19,<1.0",
    "pillow>=10.0,<14.0",
    "tomli-w>=1.0,<2.0",
    "packaging>=23.0,<28.0",
    "psutil>=5.9,<8.0",
    "pyyaml>=6.0,<7.0",
    "customtkinter>=5.2,<7.0",
    "qrcode>=7.4,<9.0",
    "pywin32>=306; sys_platform=='win32'",
]

[project.scripts]
hecos-tray = "tray.tray_app:run_tray"

[tool.setuptools.packages.find]
where = ["."]
